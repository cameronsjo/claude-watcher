# Drift-check mapping: upstream docs filename -> ecosystem file(s) to compare against.
#
# This mapping is itself drift-prone and is the maintenance cost of the feature.
# Entries MUST be reviewed when upstream docs are restructured (page renames,
# splits, merges) AND when the ecosystem side moves files. Keys use the
# docs__en__<page>.md filename convention produced by fetcher._url_to_filename().
#
# Targets live in the PRIVATE cameronsjo/cadence monorepo, so they are fetched
# through the GitHub contents API (raw media type) with WATCHER_GITHUB_TOKEN
# (fine-grained, contents:read on cadence). At scheduler startup every URL here
# is probed and any unreachable one is logged, so a stale entry is loud.
#
# Verified 2026-10-23 against cadence main. Dropped with no counterpart in the
# monorepo: docs/hooks-reference.md, docs/tools-reference.md, and
# cadence-forge docs/tool-usage-patterns.md (so docs__en__tools-reference.md has
# no mapping).

docs__en__sub-agents.md:
  - https://api.github.com/repos/cameronsjo/cadence/contents/plugins/cadence/skills/writing-subagents/SKILL.md?ref=main

docs__en__agent-teams.md:
  - https://api.github.com/repos/cameronsjo/cadence/contents/plugins/cadence/skills/using-agent-teams/SKILL.md?ref=main

docs__en__skills.md:
